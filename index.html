<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <title>ИдеяLab — Генератор идей для Гульданы Ерболовны</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --panel: rgba(18, 26, 43, 0.75);
      --panel-solid: #111a2e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --accent-2: #06b6d4;
      --accent-2-glow: rgba(6, 182, 212, 0.4);
      --line: rgba(255, 255, 255, 0.08);
      --line-bright: rgba(255, 255, 255, 0.18);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновые анимированные свечения */
    .bg-blobs {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      animation: floatBlob 18s ease-in-out infinite alternate;
    }
    .blob-1 {
      top: -100px;
      left: -100px;
      background: #7c3aed;
    }
    .blob-2 {
      top: 30%;
      right: -150px;
      background: #0284c7;
      animation-delay: -5s;
    }
    .blob-3 {
      bottom: -100px;
      left: 20%;
      background: #0d9488;
      animation-delay: -10s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-40px, 80px) scale(0.95); }
    }

    .wrap {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0 60px;
    }

    /* Шапка */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 48px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
    }
    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      font-size: 22px;
      box-shadow: 0 0 25px var(--accent-glow);
      position: relative;
    }
    .logo::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 17px;
      background: linear-gradient(135deg, #fff, transparent);
      opacity: 0.3;
      z-index: -1;
    }
    .tag {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 8px 16px;
      backdrop-filter: blur(10px);
    }

    /* Герой-секция */
    .hero {
      max-width: 780px;
      margin-bottom: 36px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 6px 14px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -2px;
      font-weight: 800;
      margin: 0 0 18px;
    }
    h1 span {
      background: linear-gradient(135deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .intro {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
      max-width: 660px;
      margin: 0;
    }

    /* Основной макет */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.85fr);
      gap: 24px;
      align-items: stretch;
    }

    /* Карточки */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      position: relative;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .card:hover {
      border-color: var(--line-bright);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .small-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 8px;
    }

    /* Блок идеи */
    .idea-box {
      min-height: 260px;
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: var(--radius-md);
      padding: 28px;
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.08), rgba(6, 182, 212, 0.04));
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .idea-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, #a855f7, #0
